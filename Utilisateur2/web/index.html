<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pandora Box - Jeu de stress et multijoueur">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pandora Box">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA meta tags -->
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PC compatibility -->
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-config" content="browserconfig.xml">
  
  <!-- Cross-platform compatibility -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="format-detection" content="telephone=no">
  
  <!-- Performance optimizations -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <link rel="manifest" href="manifest.json">

  <title>Pandora Box</title>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" as="style">
  <link rel="preload" href="https://www.gstatic.com/flutter-canvaskit/18b71d647a292a980abb405ac7d16fe1f0b20434/canvaskit.js" as="script">
  
  <!-- CSS for better PC compatibility -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* PC-specific styles */
    @media (min-width: 1024px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    }
    
    /* Mobile-specific styles */
    @media (max-width: 1023px) {
      body {
        background-color: #000000;
      }
      
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
      }
    }
    
    /* Hide loading when Flutter is ready */
    .flutter-ready #loading {
      display: none;
    }
    
    /* Error handling */
    .error-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #dc3545;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 9999;
      font-family: 'Roboto', sans-serif;
    }
    
    /* Connection status */
    .connection-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      z-index: 9999;
    }
    
    .connection-online {
      background-color: #28a745;
      color: white;
    }
    
    .connection-offline {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div>Chargement de Pandora Box...</div>
  </div>
  
  <!-- Connection status indicator -->
  <div id="connection-status" class="connection-status connection-offline" style="display: none;">
    <span id="connection-text">Hors ligne</span>
  </div>
  
  <!-- Error message container -->
  <div id="error-container"></div>

  <script>
    // Connection status monitoring
    function updateConnectionStatus() {
      const statusElement = document.getElementById('connection-status');
      const textElement = document.getElementById('connection-text');
      
      if (navigator.onLine) {
        statusElement.className = 'connection-status connection-online';
        textElement.textContent = 'En ligne';
      } else {
        statusElement.className = 'connection-status connection-offline';
        textElement.textContent = 'Hors ligne';
      }
      
      statusElement.style.display = 'block';
    }
    
    // Monitor connection status
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    updateConnectionStatus();
    
    // Error handling - Improved version
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.error);
      
      // Only show error for critical errors, not Firebase initialization issues
      if (e.error && e.error.message) {
        const errorMessage = e.error.message.toLowerCase();
        if (errorMessage.includes('firebase') || 
            errorMessage.includes('configuration') ||
            errorMessage.includes('auth') ||
            errorMessage.includes('network')) {
          console.warn('Non-critical error, not showing user message:', e.error);
          return;
        }
      }
      
      // Only show error for truly critical issues
      if (e.filename && !e.filename.includes('firebase')) {
        showError('Une erreur est survenue. Veuillez recharger la page.');
      }
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled promise rejection:', e.reason);
      
      // Only show error for critical rejections
      if (e.reason && typeof e.reason === 'string') {
        const reason = e.reason.toLowerCase();
        if (reason.includes('firebase') || 
            reason.includes('configuration') ||
            reason.includes('auth') ||
            reason.includes('network')) {
          console.warn('Non-critical promise rejection, not showing user message:', e.reason);
          return;
        }
      }
      
      showError('Erreur de connexion. Vérifiez votre connexion internet.');
    });
    
    function showError(message) {
      const errorContainer = document.getElementById('error-container');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.textContent = message;
      errorContainer.appendChild(errorDiv);
      
      // Auto-remove after 5 seconds
      setTimeout(() => {
        if (errorDiv.parentNode) {
          errorDiv.parentNode.removeChild(errorDiv);
        }
      }, 5000);
    }
    
    // Flutter ready detection with timeout
    let flutterReady = false;
    
    window.addEventListener('flutter-first-frame', function() {
      flutterReady = true;
      document.body.classList.add('flutter-ready');
      console.log('Flutter app loaded successfully');
    });
    
    // Fallback timeout for Flutter loading
    setTimeout(function() {
      if (!flutterReady) {
        console.warn('Flutter loading timeout, showing app anyway');
        document.body.classList.add('flutter-ready');
      }
    }, 10000); // 10 seconds timeout
    
    // PC-specific optimizations
    if (window.innerWidth >= 1024) {
      // Disable context menu on PC for better game experience
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
      
      // Disable text selection for better game experience
      document.addEventListener('selectstart', function(e) {
        e.preventDefault();
      });
    }
    
    // Performance monitoring
    if ('performance' in window) {
      window.addEventListener('load', function() {
        setTimeout(function() {
          const perfData = performance.getEntriesByType('navigation')[0];
          console.log('Page load time:', perfData.loadEventEnd - perfData.loadEventStart, 'ms');
        }, 0);
      });
    }
  </script>

  <script src="https://www.gstatic.com/flutter-canvaskit/18b71d647a292a980abb405ac7d16fe1f0b20434/canvaskit.js" async></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
